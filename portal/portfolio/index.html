<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>QUD Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #12151a;
      --border: #262b33;
      --text: #f2f4f7;
      --muted: #8d96a3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(100%, 960px);
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 32px;
    }

    .brand {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    p {
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-labelledby="page-title">
      <p class="brand">QUD</p>
      <h1 id="page-title">Portfolio</h1>
      <p>Прототип личного кабинета находится в разработке.</p>
    </section>
  </main>
</body>
</html>
