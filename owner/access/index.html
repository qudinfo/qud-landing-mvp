<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUD Capital Owner Access</title>
<style>
:root{--bg:#090b0d;--panel:#101317;--border:#22272d;--text:#f3f4f6;--muted:#9aa1aa;--accent:#d8a24b}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}.container{max-width:1100px;margin:auto;padding:40px 24px}.section{padding:45px 0;border-bottom:1px solid var(--border)}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px;margin-top:20px}h1{font-size:52px;line-height:1.05}h2{font-size:28px}p{line-height:1.6}.small{color:var(--muted);font-size:14px}.calculator{display:grid;grid-template-columns:1fr 1fr;gap:24px}.control{margin-bottom:18px}.range{width:100%;accent-color:#7f8791}.range-value{float:right}.value{font-size:32px;color:var(--accent);font-weight:700}@media(max-width:760px){h1{font-size:34px}.calculator{grid-template-columns:1fr}}
</style>
</head>
<body><div class="container">
<div class="section"><h2>Сценарная модель капитала</h2><p class="small">Сценарная модель показывает возможную динамику виртуального капитала на основе выбранных параметров. Не является прогнозом будущего результата.</p>
<div class="card"><div class="calculator"><div>
<div class="control"><label>Размер капитала <span id="capitalValue" class="range-value">10 000 USD</span></label><input id="capital" class="range" type="range" min="1000" max="25000" step="1000" value="10000"></div>
<div class="control"><label>Уровень доверия QUD <span id="trustValue" class="range-value">Потенциальный</span></label><input id="trust" class="range" type="range" min="1" max="3" value="2"></div>
<div class="control"><label>Среднее историческое изменение <span id="changeValue" class="range-value">+3% / месяц</span></label><input id="change" class="range" type="range" min="1" max="6" value="3"></div>
<div class="control"><label>Период наблюдения <span id="periodValue" class="range-value">3 месяца</span></label><input id="period" class="range" type="range" min="1" max="6" value="3"></div>
</div><div><p>Пример сценария</p><div id="result" class="value">+$900</div><p class="small">Изменение виртуального капитала при выбранных параметрах.</p></div></div></div></div>
<script>
function calc(){
const capital=+document.getElementById('capital').value;
const change=+document.getElementById('change').value/100;
const period=+document.getElementById('period').value;
const result=Math.round(capital*change*period);
document.getElementById('capitalValue').textContent=capital.toLocaleString('en-US')+' USD';
document.getElementById('changeValue').textContent='+'+document.getElementById('change').value+'% / месяц';
document.getElementById('periodValue').textContent=period+' '+(period===1?'месяц':'месяца');
document.getElementById('trustValue').textContent=['Начальный','Потенциальный','Высокий'][+document.getElementById('trust').value-1];
document.getElementById('result').textContent='+$'+result.toLocaleString('en-US');
}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));calc();
</script>
</div></body></html>
