<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Ключ доступа — QUD</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./invitation.css?v=2">
  <script src="./claim.js?v=2" defer></script>
</head>
<body>
  <main class="invitation" aria-labelledby="title">
    <header>
      <img src="../qud-logo.svg" width="68" height="32" alt="QUD">
      <span id="status" hidden></span>
    </header>
    <h1 id="title" aria-live="polite">Получаем ключ…</h1>
    <noscript>Для получения ключа включите JavaScript и снова откройте письмо.</noscript>
    <div id="received" hidden>
      <div class="key-field">
        <input id="key" aria-labelledby="title" readonly spellcheck="false" autocomplete="off" dir="ltr">
        <button type="button" id="copy" aria-label="Скопировать ключ">
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
          <span id="copy-label">Скопировать</span>
        </button>
      </div>
    </div>
    <p id="message" role="status"></p>
    <button id="retry" class="button button-secondary" type="button" hidden>Повторить попытку</button>
    <a id="login" class="button button-secondary" href="../?lang=ru" hidden>Войти в кабинет <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
