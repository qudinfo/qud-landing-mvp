name: One-time portfolio result-state fix

on:
  push:
    paths:
      - '.github/workflows/fix-portfolio-result-state.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Hide completed loading state
        shell: python
        run: |
          from pathlib import Path

          path = Path('portal/portfolio/index.html')
          text = path.read_text(encoding='utf-8')
          old = '.workspace[hidden], .access-view[hidden], .create-form[hidden], .portfolio-view[hidden] { display: none; }'
          new = '.workspace[hidden], .access-view[hidden], .create-form[hidden], .portfolio-view[hidden], .result-state[hidden] { display: none; }'

          if old not in text:
              raise SystemExit('Expected CSS rule not found; no changes made.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/portfolio/index.html
          git commit -m "Hide portfolio loading state after data loads"
          git push origin main
