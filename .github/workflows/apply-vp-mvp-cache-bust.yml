name: Apply VP MVP cache bust

on:
  push:
    branches:
      - vp-mvp-cache-bust-diagnostics-3
    paths:
      - tools/vp_mvp_cache_bust_trigger.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Force fresh MVP assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply cache-bust markers
        run: python3 tools/apply_vp_mvp_cache_bust.py
      - name: Commit generated change
        run: |
          rm tools/apply_vp_mvp_cache_bust.py tools/vp_mvp_cache_bust_trigger.txt .github/workflows/apply-vp-mvp-cache-bust.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Force fresh MVP assets'
          git push
