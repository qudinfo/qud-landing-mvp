name: Apply VP chart observation fix

on:
  push:
    branches:
      - vp-mvp-chart-observation-v1
    paths:
      - tools/apply_vp_chart_observation_fix.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply VP chart observation fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply transformation
        run: python3 tools/apply_vp_chart_observation_fix.py
      - name: Validate MVP code
        run: |
          cp portal/portfolio/mvp/app.js /tmp/vp-mvp-app.js
          node --check /tmp/vp-mvp-app.js
          python3 - <<'PY'
          from pathlib import Path
          app = Path('portal/portfolio/mvp/app.js').read_text()
          html = Path('portal/portfolio/mvp/index.html').read_text()
          css = Path('portal/portfolio/mvp/styles.css').read_text()
          required = [
              'referencePoints: allocatedPoints',
              "referenceLabel: 'Распределено'",
              'row.total_allocated_usd',
              'chart-reference-line',
              'capital < 1000',
              "INVALID_ALLOCATED_BALANCE",
              'min="1000"',
              'Пополнение не считается прибылью'
          ]
          joined = '\n'.join([app, html, css])
          for marker in required:
              if marker not in joined:
                  raise SystemExit(f'missing MVP regression marker: {marker}')
          print('MVP chart and observation validation passed')
          PY
      - name: Commit generated source
        run: |
          rm tools/apply_vp_chart_observation_fix.py
          rm .github/workflows/apply-vp-chart-observation-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply VP chart observation fix'
          git push
