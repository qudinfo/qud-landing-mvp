name: Apply VP MVP stage 1

on:
  push:
    branches:
      - vp-mvp-stage1
    paths:
      - tools/vp_mvp_stage1_trigger.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply VP MVP stage 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply source transformation
        run: python3 tools/apply_vp_mvp_stage1.py
      - name: Validate Apps Script syntax
        run: |
          cp portal/portfolio/backend/apps-script/Code.gs /tmp/Code.js
          cp portal/portfolio/backend/apps-script/WeeklyUpdate.gs /tmp/WeeklyUpdate.js
          node --check /tmp/Code.js
          node --check /tmp/WeeklyUpdate.js
      - name: Commit generated sources
        run: |
          rm tools/apply_vp_mvp_stage1.py tools/vp_mvp_stage1_trigger.txt .github/workflows/apply-vp-mvp-stage1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply VP MVP stage 1'
          git push
