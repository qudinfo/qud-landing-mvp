name: QUD VP backend atomic write fix

on:
  push:
    paths:
      - .github/workflows/qud-vp-backend-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Apps Script write order
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('portal/portfolio/backend/apps-script/Code.gs')
          text = path.read_text(encoding='utf-8')

          old = '''    // The latest request for this strategy is replaced by the new one.
    if (headerMap.is_latest_strategy_request !== undefined) {
      requestTable.objects.forEach((row, index) => {
        if (
          String(row.portfolio_id) === portfolioId &&
          String(row.strategy_id) === strategyId &&
          toBoolean_(row.is_latest_strategy_request)
        ) {
          requestsSheet.getRange(index + 2, headerMap.is_latest_strategy_request + 1).setValue(false);
        }
      });
    }

    const values = [
'''

          new = '''    // Keep the previous latest request intact until the new row passes QA.
    const previousLatestRows = [];
    if (headerMap.is_latest_strategy_request !== undefined) {
      requestTable.objects.forEach((row, index) => {
        if (
          String(row.portfolio_id) === portfolioId &&
          String(row.strategy_id) === strategyId &&
          toBoolean_(row.is_latest_strategy_request)
        ) {
          previousLatestRows.push(index + 2);
        }
      });
    }

    const values = [
'''

          old2 = '''    if (!createdRequest) {
      throw apiError_('REQUEST_QA_FAILED', 500);
    }

    return {
'''

          new2 = '''    if (!createdRequest) {
      requestsSheet.getRange(appendRow, 1, 1, values.length).clearContent();
      if (headerMap.is_latest_strategy_request !== undefined) {
        requestsSheet
          .getRange(appendRow, headerMap.is_latest_strategy_request + 1)
          .clearContent();
      }
      SpreadsheetApp.flush();
      throw apiError_('REQUEST_QA_FAILED', 500);
    }

    if (headerMap.is_latest_strategy_request !== undefined) {
      previousLatestRows.forEach((rowNumber) => {
        requestsSheet
          .getRange(rowNumber, headerMap.is_latest_strategy_request + 1)
          .setValue(false);
      });
      SpreadsheetApp.flush();
    }

    return {
'''

          if old not in text:
              raise SystemExit('First target block not found')
          if old2 not in text:
              raise SystemExit('Second target block not found')

          text = text.replace(old, new, 1).replace(old2, new2, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "QUD Automation"
          git config user.email "actions@users.noreply.github.com"
          git add portal/portfolio/backend/apps-script/Code.gs
          git commit -m "Make strategy request write atomic" || exit 0
          git push
