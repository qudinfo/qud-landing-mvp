name: Apply VP update labels fix

on:
  push:
    branches:
      - vp-mvp-update-labels
    paths:
      - tools/apply_vp_update_labels_fix.py
      - .github/workflows/apply-vp-update-labels-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply VP update labels fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply transformation
        run: python3 tools/apply_vp_update_labels_fix.py
      - name: Validate MVP code
        run: |
          cp portal/portfolio/mvp/app.js /tmp/vp-mvp-app.js
          node --check /tmp/vp-mvp-app.js
          python3 - <<'PY'
          from pathlib import Path
          app = Path('portal/portfolio/mvp/app.js').read_text()
          html = Path('portal/portfolio/mvp/index.html').read_text()
          css = Path('portal/portfolio/mvp/styles.css').read_text()
          required = [
              'latestPortfolioChangeValue',
              'latestHistoryPeriodValue',
              'row.created_at_utc',
              'Портфель изменён:',
              'История рассчитана по:',
              'max-width: 360px',
              'app.js?v=20260807-1553',
              'styles.css?v=20260807-1553'
          ]
          joined = '\n'.join([app, html, css])
          for marker in required:
              if marker not in joined:
                  raise SystemExit(f'missing MVP regression marker: {marker}')
          forbidden = ['Данные обновлены: ${formatDate(updated)}']
          for marker in forbidden:
              if marker in joined:
                  raise SystemExit(f'legacy update marker still present: {marker}')
          print('MVP update label validation passed')
          PY
      - name: Commit generated source
        run: |
          rm tools/apply_vp_update_labels_fix.py
          rm .github/workflows/apply-vp-update-labels-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply VP update labels fix'
          git push
