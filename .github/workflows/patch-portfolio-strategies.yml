name: Patch portfolio strategies payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-portfolio-strategies.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add multi-strategy response payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('portal/portfolio/backend/apps-script/Code.gs')
          text = path.read_text(encoding='utf-8')

          history_anchor = """  const compatibilityHistory = primarySlot
            ? strategyHistory.filter((row) => String(row.request_id) === String(primarySlot.request_id))
            : portfolioHistory;

          return {
          """

          history_replacement = """  const compatibilityHistory = primarySlot
            ? strategyHistory.filter((row) => String(row.request_id) === String(primarySlot.request_id))
            : portfolioHistory;

          const strategies = slots.map((slot) => Object.assign({}, slot, {
            history: strategyHistory.filter(
              (row) => String(row.request_id) === String(slot.request_id)
            )
          }));

          return {
          """

          top_level_anchor = """    portfolio: compatibilityPortfolio,
            strategy_slots: slots,
          """

          top_level_replacement = """    portfolio: compatibilityPortfolio,
            strategies: strategies,
            strategy_slots: slots,
          """

          data_anchor = """      portfolio: compatibilityPortfolio,
              strategy_slots: slots,
          """

          data_replacement = """      portfolio: compatibilityPortfolio,
              strategies: strategies,
              strategy_slots: slots,
          """

          for anchor, replacement, label in (
              (history_anchor, history_replacement, 'strategies builder'),
              (top_level_anchor, top_level_replacement, 'top-level strategies field'),
              (data_anchor, data_replacement, 'data strategies field'),
          ):
              if anchor not in text:
                  raise SystemExit(f'Missing expected anchor: {label}')
              text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/patch-portfolio-strategies.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/portfolio/backend/apps-script/Code.gs .github/workflows/patch-portfolio-strategies.yml
          git commit -m "Add strategies payload to portfolio API"
          git push

# Trigger after workflow registration
