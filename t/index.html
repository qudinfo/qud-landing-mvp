<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>QUD</title>
  </head>
  <body>
    <script>
      (() => {
        const referralCode = String(
          new URLSearchParams(window.location.search).get('ref') || ''
        )
          .trim()
          .toUpperCase()
          .replace(/\s+/g, '');

        if (/^QUDPTP-\d{5}$/.test(referralCode)) {
          try {
            window.localStorage.setItem(
              'qudPilotReferralCode',
              referralCode
            );
          } catch (error) {
            // The visitor still reaches the trader page when storage is unavailable.
          }
        }

        window.location.replace('/traders/tradermap/');
      })();
    </script>
  </body>
</html>
