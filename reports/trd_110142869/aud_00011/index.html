<!doctype html>
<meta charset="utf-8">
<title>QUD TDA Trial</title>
<body style="margin:0;background:#0b0d0f;color:#c6c6c6;font-family:Arial,sans-serif">
<div style="padding:32px">Loading report…</div>
<script>
const SOURCE_URL="https://raw.githubusercontent.com/qudinfo/qud-landing-mvp/fc859593b129dde0520261207697b987a35ec3f6/reports/trd_110142869/aud_00011/index.html";

function holdingChartPatchSource(){
  return String.raw`function holdingTimeEfficiencyBars(svg,model,baselineValue){
  clear(svg);
  const groups=Array.isArray(model&&model.groups)?model.groups:[];
  const baseline=Number(baselineValue);
  const rows=groups.map(group=>{
    const winRate=Number(group&&group.win_rate_pct);
    const minDuration=Number(group&&group.duration_min);
    const maxDuration=Number(group&&group.duration_max);
    const available=Number.isFinite(winRate)&&Number.isFinite(baseline);
    return{
      x:Number.isFinite(minDuration)&&Number.isFinite(maxDuration)
        ?formatHoldingDuration(minDuration)+'–'+formatHoldingDuration(maxDuration)
        :'N/A',
      winRate:available?winRate:null,
      delta:available?winRate-baseline:null
    };
  });
  const w=svg.clientWidth||600,h=svg.clientHeight||220,p={l:42,r:24,t:18,b:60};
  const deltas=rows.map(row=>row.delta).filter(Number.isFinite);
  const maxAbs=Math.max(10,...deltas.map(value=>Math.abs(value)));
  const minY=-maxAbs,maxY=maxAbs;
  const barAreaLeft=Math.min(w-p.r-36,Math.max(170,w*.18));
  const barAreaRight=w-p.r-18;
  const compactSpan=Math.min(barAreaRight-barAreaLeft,Math.max(0,(rows.length-1)*180));
  const barLeft=(barAreaLeft+barAreaRight-compactSpan)/2;
  const barRight=barLeft+compactSpan;
  const x=index=>rows.length<=1?(barLeft+barRight)/2:barLeft+(barRight-barLeft)*index/(rows.length-1);
  const y=value=>h-p.b-(h-p.t-p.b)*(value-minY)/(maxY-minY||1);
  for(let i=0;i<=4;i++){
    const yy=p.t+(h-p.t-p.b)*i/4;
    svg.appendChild(svgEl('line',{x1:p.l,y1:yy,x2:w-p.r,y2:yy,class:'gridline'}));
  }
  const baselineY=y(0);
  svg.appendChild(svgEl('line',{
    x1:p.l,y1:baselineY,x2:w-p.r,y2:baselineY,
    stroke:'#66717b','stroke-width':1,'stroke-dasharray':'4 4'
  }));
  if(Number.isFinite(baseline)){
    svg.appendChild(svgEl('text',{
      x:p.l-26,y:baselineY-8,'text-anchor':'start',class:'axis-label'
    })).textContent='Trader Win Rate '+baseline.toFixed(1)+'%';
  }
  const bw=Math.min(34,Math.max(24,(barRight-barLeft)/Math.max(rows.length,1)*.38));
  rows.forEach((row,index)=>{
    const cx=x(index);
    if(row.winRate===null){
      svg.appendChild(svgEl('text',{
        x:cx,y:baselineY+38,'text-anchor':'middle',class:'axis-label'
      })).textContent='N/A';
    }else{
      const delta=row.delta;
      if(Math.abs(delta)<0.000001){
        svg.appendChild(svgEl('rect',{
          x:cx-bw/2,y:baselineY-3,width:bw,height:6,rx:3,
          fill:green(),opacity:.9
        }));
      }else{
        const top=y(Math.max(0,delta));
        const bottom=y(Math.min(0,delta));
        svg.appendChild(svgEl('rect',{
          x:cx-bw/2,y:top,width:bw,height:Math.max(3,bottom-top),rx:3,
          fill:delta>0?green():red(),opacity:.9
        }));
      }
      svg.appendChild(svgEl('text',{
        x:cx,
        y:row.delta>0?y(row.delta)-8:row.delta<0?y(row.delta)+16:baselineY-10,
        'text-anchor':'middle',class:'axis-label'
      })).textContent=row.winRate.toFixed(0)+'%';
    }
    svg.appendChild(svgEl('text',{
      x:cx,y:h-12,'text-anchor':'middle',class:'axis-label'
    })).textContent=row.x;
  });
}
`;
}

fetch(SOURCE_URL,{cache:'no-store'})
  .then(response=>{
    if(!response.ok)throw new Error(response.status);
    return response.text();
  })
  .then(source=>{
    const helper=`
function patchHoldingTimeChart(html){
  const start=html.indexOf('function holdingTimeEfficiencyBars(');
  const end=html.indexOf('function bars(',start);
  if(start<0||end<0)throw new Error('holding time chart function not found');
  return html.slice(0,start)+holdingChartPatchSource()+html.slice(end);
}
`;
    source=source.replace('const TEMPLATE_URL=',helper+'\nconst TEMPLATE_URL=');
    source=source.replace(
      'document.open();document.write(t);document.close();',
      't=patchHoldingTimeChart(t);document.open();document.write(t);document.close();'
    );
    document.open();
    document.write(source);
    document.close();
  })
  .catch(error=>{
    document.body.innerHTML='<div style="padding:32px">Report loading error: '+String(error.message||error)+'</div>';
  });
</script>
