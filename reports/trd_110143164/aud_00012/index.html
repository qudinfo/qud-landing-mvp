<!doctype html>
<meta charset="utf-8">
<title>QUD TDA Trial</title>
<body style="margin:0;background:#0b0d0f;color:#c6c6c6;font-family:Arial,sans-serif">
<div style="padding:32px">Loading report…</div>
<script>
const SOURCE_URL="https://raw.githubusercontent.com/qudinfo/qud-landing-mvp/bc7fec1f32fb4fca057a40faddcdb85d103e48e9/reports/trd_110143164/aud_00012/index.html";
fetch(SOURCE_URL,{cache:'no-store'})
  .then(response=>{
    if(!response.ok)throw new Error(response.status);
    return response.text();
  })
  .then(source=>{
    source=source
      .replace('"qud_tda_score":20.06','"qud_tda_score":0.0')
      .replace('"history_trust_factor":0.25','"history_trust_factor":0.0')
      .replace('"trust_score_delta":null','"trust_score_delta":0.0')
      .replace('"score_history":[{"period":"2026-07-27 — 2026-07-31","value":20.06','"score_history":[{"period":"2026-07-27 — 2026-07-31","value":0.0');

    const oldWrite='document.open();document.write(t);document.close()';
    const newWrite=`t=t.replace('</body>','<script>(function(){const el=document.getElementById("lossNoteTop");if(el)el.innerHTML="Risk drift: <b>N/A</b>";})();<\\/script></body>');document.open();document.write(t);document.close()`;
    if(!source.includes(oldWrite))throw new Error('report write hook not found');
    source=source.replace(oldWrite,newWrite);

    document.open();
    document.write(source);
    document.close();
  })
  .catch(error=>{
    document.body.innerHTML='<div style="padding:32px">Report loading error: '+String(error.message||error)+'</div>';
  });
</script>
