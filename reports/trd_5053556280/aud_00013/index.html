<!doctype html><meta charset="utf-8"><title>QUD TDA Basic</title>
<body style="margin:0;background:#0b0d0f;color:#c6c6c6;font-family:Arial,sans-serif"><div style="padding:32px">Loading report…</div>
<script>
const SOURCE_URL="https://raw.githubusercontent.com/qudinfo/qud-landing-mvp/55327c43b1a36bd8cf1259399d26c1a0b14934bf/reports/trd_5053556280/aud_00013/index.html";
fetch(SOURCE_URL,{cache:'no-store'}).then(r=>r.text()).then(source=>{
 const m=source.match(/const REPORT=(\{[\s\S]*?\});\nconst TEMPLATE_URL=/); if(!m)throw new Error('report data not found');
 const report=JSON.parse(m[1]);
 report.score.qud_tda_score=40.00;
 report.score.history_trust_factor=0.00;
 report.score.trust_zone='QUD Room';
 report.score.trust_score_delta='not_available';
 report.score.display_class='warn';
 report.score.restored_scoring_note='Historical Trust Score is not calculated for the restored period because confirmed risk-discipline data is unavailable. QUD administrative start: Trust Score 40.00, QUD Room.';
 report.comparison.score_history=[{period:'2026-08-10',value:40.00,source:'administrative_start'}];
 const row=report.comparison.items.find(x=>x&&x.metric==='QUD TDA Score');
 if(row){row.previous='not_available';row.current=40.00;row.change='not_available';row.status='administrative_start';}
 if(report.findings&&report.findings.items&&report.findings.items.length>=5){report.findings.items[4]={text:'Из-за отсутствия подтверждённых данных по риск-дисциплине за восстановленный период исторический Trust Score не рассчитывается. QUD административно устанавливает стартовый Trust Score = 40.00 в зоне QUD Room.',severity:'technical',display_class:'warn',source_block:'Trust Score',metric:'administrative_start_score'};}
 source=source.replace(m[1],JSON.stringify(report)); document.open();document.write(source);document.close();
}).catch(e=>{document.body.innerHTML='<div style="padding:32px">Report loading error: '+String(e.message||e)+'</div>';});
</script>
