function decodeBase64Utf8(value){
  const bin=atob(String(value||'').replace(/\s/g,''));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
fetch(SOURCE_BLOB_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('source '+r.status);return r.json()}).then(blob=>{
  let source=decodeBase64Utf8(blob.content);
  const match=source.match(/const PATCH=(\{[\s\S]*?\});\nPromise\.all/);
  if(!match)throw new Error('report patch not found');
  const patch=JSON.parse(match[1]);
  patch.score.qud_tda_score=61.84;
  patch.score.weekly_quality_score=72.75;
  patch.score.history_trust_factor=0.85;
  patch.score.trust_zone='QUD Room';
  patch.score.trust_score_delta=6.34;
  patch.score.display_class='warn';
  patch.comparison.score_history=SCORE_HISTORY;
  const scoreRow=patch.comparison.items.find(x=>x&&x.metric==='QUD TDA Score');
  if(scoreRow){scoreRow.previous=55.50;scoreRow.current=61.84;scoreRow.change=6.34;scoreRow.status='improved';}
  source=source.replace(match[1],JSON.stringify(patch));
  document.open();document.write(source);document.close();
}).catch(e=>{document.body.innerHTML='<div style="padding:32px">Report loading error: '+String(e.message||e)+'</div>';});
</script>
