<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUD TDA Basic — Design Lab</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b0d0f;overflow:hidden}
#reportFrame{display:block;width:100%;height:100vh;border:0;background:#0b0d0f}
</style>
</head>
<body>
<iframe id="reportFrame" src="../aud_.0003/" title="QUD TDA Basic"></iframe>
<script>
const frame=document.getElementById('reportFrame');
let attempts=0;
const timer=setInterval(()=>{
  attempts++;
  try{
    const doc=frame.contentDocument;
    if(!doc) return;
    const titleBlock=doc.querySelector('.top-title-block');
    const headerMeta=doc.getElementById('headerMeta');
    const trustLabel=Array.from(doc.querySelectorAll('.label')).find(el=>el.textContent.trim().toUpperCase()==='TRUST SCORE');
    const referenceBadge=doc.getElementById('riskMode')||doc.querySelector('.badge');
    if(!titleBlock||!headerMeta||!trustLabel||!referenceBadge){if(attempts>300)clearInterval(timer);return;}
    if(!doc.getElementById('qud-design-lab-style')){
      const style=doc.createElement('style');
      style.id='qud-design-lab-style';
      style.textContent='@media(min-width:1101px){.top-title-block{transform:translateY(-18px)!important;}}';
      doc.head.appendChild(style);
    }
    let strategyLabel=doc.getElementById('strategyInterestLabel');
    if(!strategyLabel){
      strategyLabel=trustLabel.cloneNode(true);
      strategyLabel.id='strategyInterestLabel';
      strategyLabel.textContent='STRATEGY INTEREST';
      strategyLabel.style.position='absolute';
      strategyLabel.style.textAlign='left';
      strategyLabel.style.margin='0';
      strategyLabel.style.zIndex='20';
      strategyLabel.style.pointerEvents='none';
      doc.body.appendChild(strategyLabel);
    }
    let demoBadge=doc.getElementById('strategyDemoBadge');
    if(!demoBadge){
      demoBadge=referenceBadge.cloneNode(true);
      demoBadge.id='strategyDemoBadge';
      demoBadge.className='badge neutral';
      demoBadge.textContent='2 DEMO';
      demoBadge.style.position='absolute';
      demoBadge.style.margin='0';
      demoBadge.style.zIndex='20';
      demoBadge.style.pointerEvents='none';
      demoBadge.style.visibility='hidden';
      doc.body.appendChild(demoBadge);
    }
    const positionStrategyElements=()=>{
      const titleRect=titleBlock.getBoundingClientRect();
      const headerRect=headerMeta.getBoundingClientRect();
      const trustRect=trustLabel.getBoundingClientRect();
      const titleStyle=doc.defaultView.getComputedStyle(titleBlock);
      const titlePaddingLeft=parseFloat(titleStyle.paddingLeft)||0;
      const win=doc.defaultView;
      const left=titleRect.left+titlePaddingLeft+win.scrollX;
      strategyLabel.style.left=left+'px';
      strategyLabel.style.top=(trustRect.top+win.scrollY)+'px';
      const strategyRect=strategyLabel.getBoundingClientRect();
      const badgeRect=demoBadge.getBoundingClientRect();
      const gapTop=headerRect.bottom;
      const gapBottom=strategyRect.top;
      const badgeTop=gapTop+Math.max(0,(gapBottom-gapTop-badgeRect.height)/2);
      demoBadge.style.left=left+'px';
      demoBadge.style.top=(badgeTop+win.scrollY)+'px';
      demoBadge.style.visibility='visible';
    };
    positionStrategyElements();
    frame.contentWindow.addEventListener('resize',positionStrategyElements);
    clearInterval(timer);
  }catch(e){
    if(attempts>300)clearInterval(timer);
  }
},100);
</script>
</body>
</html>
