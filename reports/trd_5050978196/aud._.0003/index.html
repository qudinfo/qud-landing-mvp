<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUD TDA Basic — Design Lab</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b0d0f;overflow:hidden}
#reportFrame{display:block;width:100%;height:100vh;border:0;background:#0b0d0f}
</style>
</head>
<body>
<iframe id="reportFrame" src="../aud_.0003/" title="QUD TDA Basic"></iframe>
<script>
const frame=document.getElementById('reportFrame');
let attempts=0;
const timer=setInterval(()=>{
  attempts++;
  try{
    const doc=frame.contentDocument;
    if(!doc) return;
    const titleBlock=doc.querySelector('.top-title-block');
    if(!titleBlock){if(attempts>300)clearInterval(timer);return;}
    if(!doc.getElementById('qud-design-lab-style')){
      const style=doc.createElement('style');
      style.id='qud-design-lab-style';
      style.textContent='@media(min-width:1101px){.top-title-block{transform:translateY(-18px)!important;}}';
      doc.head.appendChild(style);
    }
    clearInterval(timer);
  }catch(e){
    if(attempts>300)clearInterval(timer);
  }
},100);
</script>
</body>
</html>
